name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Nest-Asset-Library-macOS
          path: |
            release-*/Nest-Asset-Library-*-macOS-*.dmg
            release-*/Nest-Asset-Library-*-macOS-*.zip
      - name: Upload packages to tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-*/Nest-Asset-Library-*-macOS-*.dmg
            release-*/Nest-Asset-Library-*-macOS-*.zip

name: Build macOS

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the macOS packages
        required: false
        default: v1.8.7
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Nest-Asset-Library-macOS
          path: |
            release-*/Nest-Asset-Library-*-macOS-*.dmg
            release-*/Nest-Asset-Library-*-macOS-*.zip
      - name: Upload packages to tagged release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            release-*/Nest-Asset-Library-*-macOS-*.dmg
            release-*/Nest-Asset-Library-*-macOS-*.zip

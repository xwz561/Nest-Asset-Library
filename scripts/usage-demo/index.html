<!doctype html>

<title>小旺仔素材库 · 使用演示</title>

<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #eef0f6; }

  #stage { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .abs { position: absolute; left: 0; top: 0; }
  .card { background: #fff; border-radius: 18px; box-shadow: 0 10px 28px rgba(31, 35, 51, .07), 0 2px 6px rgba(31, 35, 51, .04); }
  .tint { background: #f1f3f8; }
  .muted { color: #8a90a3; }
